server {
    listen 80;

    # SPA：所有前端路由都返回 index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：/api/ 转发到后端，去掉 /api 前缀
    location /api/ {
        # 后端已记录不含路径参数的 route-template 安全访问日志；避免代理层
        # 再把 document_id/user_id/query 等完整 URL 元数据写入默认 access log。
        access_log off;
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
