name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: studyloop_ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: studyloop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyloop_ci -d studyloop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LLM_API_KEY: ci-placeholder
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_MODEL: ci-placeholder
      STRUCTURED_API_KEY: ci-placeholder
      STRUCTURED_BASE_URL: http://127.0.0.1:9/v1
      STRUCTURED_MODEL: ci-placeholder
      EMBEDDING_API_KEY: ci-placeholder
      EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
      LLM_EMBEDDING_MODEL: ci-placeholder
      CHROMA_DIR: /tmp/study-loop-chroma
      MEMORY_SNAPSHOT_PATH: /tmp/study-loop-memory.json
      CHECKPOINT_DB_PATH: /tmp/study-loop-checkpoints/orchestrator.db
      QUERY_REWRITE_ENABLED: "false"
      HYDE_ENABLED: "false"
      MULTIQUERY_ENABLED: "false"
      RERANKER_ENABLED: "false"
      MCP_LIVE_ENABLED: "false"
      LANGCHAIN_TRACING_V2: "false"
      TEST_DATABASE_URL: postgresql://studyloop_ci:ci-password@127.0.0.1:5432/studyloop_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run deterministic Agent demo
        run: python scripts/demo_react_tutor_agent.py
      - name: Verify published SciFact BM25 artifact
        run: python evaluation/scifact_bm25/verify.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser E2E (Chromium, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: study-loop-playwright-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 7

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration
        run: ENV_FILE=.env.example docker compose config --quiet
