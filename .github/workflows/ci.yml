name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 依赖审计每周跑一次。公告什么时候出现和本仓库什么时候提交无关，
    # 挂在 push 上等于让一条与本次修改毫无关系的 CVE 挡住工作。
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: studyloop_ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: studyloop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyloop_ci -d studyloop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LLM_API_KEY: ci-placeholder
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_MODEL: ci-placeholder
      STRUCTURED_API_KEY: ci-placeholder
      STRUCTURED_BASE_URL: http://127.0.0.1:9/v1
      STRUCTURED_MODEL: ci-placeholder
      EMBEDDING_API_KEY: ci-placeholder
      EMBEDDING_BASE_URL: http://127.0.0.1:9/v1
      LLM_EMBEDDING_MODEL: ci-placeholder
      CHROMA_DIR: /tmp/study-loop-chroma
      MEMORY_SNAPSHOT_PATH: /tmp/study-loop-memory.json
      CHECKPOINT_DB_PATH: /tmp/study-loop-checkpoints/orchestrator.db
      QUERY_REWRITE_ENABLED: "false"
      HYDE_ENABLED: "false"
      MULTIQUERY_ENABLED: "false"
      RERANKER_ENABLED: "false"
      MCP_LIVE_ENABLED: "false"
      LANGSMITH_TRACING_V2: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING: "false"
      LANGFUSE_TRACING_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://studyloop_ci:ci-password@127.0.0.1:5432/studyloop_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check .
      - name: Run deterministic tests with branch coverage
        run: >-
          python -m pytest -q --cov --cov-config=pyproject.toml
          --cov-report=term-missing:skip-covered
      - name: Run deterministic Agent demo
        run: python scripts/demo_react_tutor_agent.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser E2E (Chromium, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: study-loop-playwright-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 7

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose security defaults
        run: python scripts/check_compose_security.py

  container-smoke:
    name: Container smoke (nginx → backend → storage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-container-password
      ENV_FILE: .env.example
      COMPOSE_ANSI: never
    steps:
      - uses: actions/checkout@v7
      - name: Build production images
        run: docker compose build backend frontend
      - name: Seed a legacy root-owned Chroma volume
        run: >-
          docker compose run --rm --no-deps --user 0:0 backend
          sh -c "touch /app/chroma_db/legacy-root-owned && chown -R 0:0 /app/chroma_db"
      - name: Start the local stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify HTTP routing and backend user
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 5 http://127.0.0.1:8001/health/live
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 6 http://127.0.0.1:8001/health/ready
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 5 http://127.0.0.1:4001/
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused --connect-timeout 2 --max-time 6 http://127.0.0.1:4001/api/health/ready
          test "$(docker compose exec -T backend id -u)" = "10001"
          test "$(docker compose exec -T backend id -g)" = "10001"
          docker compose exec -T backend python -c "import os; from pathlib import Path; assert os.environ['WEB_CONCURRENCY'] == '1'; pid1 = [a for a in Path('/proc/1/cmdline').read_bytes().split(b'\0') if a]; assert b'main:app' in pid1 and b'--workers' in pid1 and pid1[pid1.index(b'--workers') + 1] == b'1', pid1; children = {int(pid) for pid in Path('/proc/1/task/1/children').read_text().split()}; children.discard(os.getpid()); assert not children, children"
          docker compose exec -T backend python -c "from pathlib import Path; p = Path('/app/chroma_db/nonroot-smoke'); p.write_text('ok'); p.unlink()"
      - name: Verify storage failure changes readiness but not liveness
        run: |
          docker compose stop postgres
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:8001/health/live
          ready_status=""
          for attempt in $(seq 1 10); do
            ready_status="$(curl --silent --show-error --output /tmp/storage-readiness.json --write-out '%{http_code}' --connect-timeout 2 --max-time 6 http://127.0.0.1:8001/health/ready || true)"
            if [ "$ready_status" = "503" ]; then break; fi
            sleep 1
          done
          test "$ready_status" = "503"
          grep -q '"code":"storage_unavailable"' /tmp/storage-readiness.json
          docker compose start postgres
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then break; fi
            sleep 1
          done
          docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          docker compose exec -T backend python -c "import os, psycopg; connection = psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=2, options='-c statement_timeout=1500ms'); assert connection.execute('SELECT 1').fetchone() == (1,); connection.close()"
          sleep 2
          stale_store_status="$(curl --silent --show-error --output /tmp/stale-store-readiness.json --write-out '%{http_code}' --connect-timeout 2 --max-time 6 http://127.0.0.1:8001/health/ready || true)"
          test "$stale_store_status" = "503"
          grep -q '"code":"postgres_unavailable"' /tmp/stale-store-readiness.json
          docker compose restart backend
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 6 http://127.0.0.1:8001/health/ready
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 6 http://127.0.0.1:4001/api/health/ready
      - name: Show container diagnostics
        if: ${{ failure() }}
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
      - name: Remove containers and test volumes
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
