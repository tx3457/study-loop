[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with high-signal correctness checks. Formatting and complexity rules can
# be introduced separately without hiding functional regressions in style churn.
select = ["E4", "E7", "E9", "F", "B006", "B012", "B023"]

[tool.coverage.run]
branch = true
relative_files = true
patch = ["subprocess"]
source = ["agents", "models", "routers", "services", "main"]

[tool.coverage.report]
fail_under = 75
include_namespace_packages = true
precision = 2
show_missing = true
skip_covered = true
