services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-shared-environments}
      POSTGRES_DB: ${POSTGRES_DB:-studyloop}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8001:8001"
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyloop}:${POSTGRES_PASSWORD:-change-me-for-shared-environments}@postgres:5432/${POSTGRES_DB:-studyloop}
    volumes:
      - chromadata:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4001:80"
    depends_on:
      - backend

volumes:
  pgdata:
  chromadata:
