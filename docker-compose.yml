services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-studyloop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: study-loop-backend:local
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyloop}@postgres:5432/${POSTGRES_DB:-studyloop}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Embedded Chroma PersistentClient is a single-process data plane.
      WEB_CONCURRENCY: "1"
    volumes:
      - chromadata:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      backend-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5).read()",
        ]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 5

  backend-volume-init:
    image: study-loop-backend:local
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/chroma_db"]
    volumes:
      - chromadata:/app/chroma_db
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4001:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  chromadata:
